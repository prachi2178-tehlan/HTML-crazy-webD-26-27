<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration form</title>
</head>
<body>
    <h2 align="center">Student Registration Form</h2>
    <hr>

    <form action="#" method="post">

        <label> Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your full name"required>
        <br><br>
        
        <label> Email:</label>
        <input type="email" name="email" placeholder="Enter valid email address" required>
        <br><br>
        
        <label> Password:</label>
        <input type="password" name="password" placeholder="Enter password" required>
        <br><br>
        
        <label> Gender:</label>
        <input type="radio" name="gender" value="Male" required>Male
        <input type="radio" name="gender" value="Female">Female
        <input type="radio" name="gender" value="Other">Other
        <br><br>
        
        <label> Course:</label>
        <select name="course" required>
            <option value="">--select course--</option>
            <option value="BTech">BTech</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="MCA">MCA</option>
        </select>
        <br><br>
        
        <label> Contact No. :</label>
        <input type="tel" name="contact" placeholder="Enter phone number" required>
        <br><br>
        
        <label> Address:</label>
        <br>
        <textarea name="address" rows="5" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="submit" value="Clear">

    </form>

    <hr>

    <center>
        <p>&copy;2025 Student Registration Portal</p>
    </center>

    
</body>
</html>
