<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC College Admission 2026</title>
</head>
<body>

<center>
    <table width="700" border="0" cellspacing="0" cellpadding="0">
        <tr>
            <td>
                <!-- Header -->
                <header>
                    <table width="100%" bgcolor="#14367d" cellpadding="20" cellspacing="0">
                        <tr>
                            <td align="center">
                                <font color="white" size="6"><b>ABC College Admission 2026</b></font>
                            </td>
                        </tr>
                    </table>
                </header>

                <!-- Main Content (slightly indented inside header/footer width) -->
                <main>
                    <table width="92%" align="center" border="0" cellspacing="0" cellpadding="0">
                        <tr>
                            <td>
                                <h2>Courses and Fees</h2>

                                <table border="1" width="100%" cellspacing="0" cellpadding="6">
                                    <caption><b>Available Courses</b></caption>
                                    <thead>
                                        <tr bgcolor="#dfe4ec">
                                            <th>Course</th>
                                            <th>Seats</th>
                                            <th>Fees</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>B.Tech CSE</td>
                                            <td>120</td>
                                            <td>&#8377;90,000</td>
                                        </tr>
                                        <tr>
                                            <td>BCA</td>
                                            <td>60</td>
                                            <td>&#8377;45,000</td>
                                        </tr>
                                    </tbody>
                                </table>

                                <br>

                                <form action="#" method="post">
                                    <fieldset>
                                        <legend>Application Form</legend>

                                        <label for="name">Name:</label><br>
                                        <input type="text" id="name" name="name" size="35"><br><br>

                                        <label for="email">Email:</label><br>
                                        <input type="email" id="email" name="email" size="35"><br><br>

                                        <label for="course">Course:</label><br>
                                        <select id="course" name="course">
                                            <option value="btech-cse">B.Tech CSE</option>
                                            <option value="bca">BCA</option>
                                        </select><br><br>

                                        <label for="statement">Statement:</label><br>
                                        <textarea id="statement" name="statement" rows="4" cols="45"></textarea><br><br>

                                        <button type="submit">Apply</button>
                                    </fieldset>
                                </form>
                            </td>
                        </tr>
                    </table>
                </main>

                <br>

                <!-- Footer -->
                <footer>
                    <table width="100%" bgcolor="#14367d" cellpadding="8" cellspacing="0">
                        <tr>
                            <td align="center">
                                <font color="white" size="2">&copy; 2026 ABC College</font>
                            </td>
                        </tr>
                    </table>
                </footer>
            </td>
        </tr>
    </table>
</center>

</body>
</html>
