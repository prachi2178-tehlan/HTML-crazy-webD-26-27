<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17</title>
</head>
<body>
    <form action="submit.php" method="post">
        <div>
            <label for="fullname"></label>
            <input type="text" id="fullname" name="fullname" placeholder="Full name" required>
        </div>
        <br>
        <div>
            <label for="email"></label>
            <input type="email" id="email" name="email" placeholder="you@example.edu" required>
        </div>
        <br>
        <div>
            <label for="mobile"></label>
            <input type="tel" id="mobile" name="mobile"  pattern="[0-9]{10}" placeholder=" 10- digit mobile">
        </div>
        <br>
        <div>
            <label for="password"></label>
            <input type="password" id="password" name="password" placeholder="Min 6 characters" minlength="6" required>
        </div>
        <br>
        <div>
            <label for="age"></label>
            <input type="number" id="age" name="age" placeholder="Age(17+)"  min="17" max="30" required>
        </div>
        <br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
